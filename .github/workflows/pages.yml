name: Build and deploy novafabric.ai (GitHub Pages)

# Pushes to main publish novafabric.ai. A manual run publishes only when `deploy` is ticked.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to GitHub Pages (false = build and upload the artifact only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # The private mirror of this tree must never try to publish.
    if: github.repository == 'MSKazemi/novafabric-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Since issue #20 (ADR-0299) this repo is the only implementation of
      # novafabric.ai. The product repo is checked out solely for build metadata
      # (next.config.ts reads its pyproject.toml); no second site is built or merged.
      - name: Checkout the product source (version metadata)
        uses: actions/checkout@v7
        with:
          repository: MSKazemi/novafabric
          ref: main
          path: .source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build (runs the link, SEO and CLI-reference gates)
        run: |
          npm ci
          npm run build

      # Fixture tests: each gate must fail on the defect it exists for. Public-safe:
      # tiny generated sites in a temp dir, no production content, no network.
      - name: Gate tests
        run: npm test

      - name: Verify the artifact
        run: |
          for p in out/index.html out/novafabric/index.html out/install/index.html \
                   out/research/index.html out/docs/index.html out/demo/index.html \
                   out/concepts/index.html out/_next out/robots.txt out/sitemap.xml out/llms.txt; do
            test -e "$p" || { echo "::error::missing $p"; exit 1; }
          done
          # One public website: nothing from the retired Astro build may ship.
          test ! -e out/_astro || { echo "::error::out/_astro exists — a second site leaked in"; exit 1; }
          echo "pages=$(cd out && find . -name index.html | wc -l) source_sha=$(git -C .source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
