<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 606" role="img" aria-labelledby="t d" font-family="Inter, 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Conceptual architecture: Jev decision evidence in NovaFabric (proposed, not shipped)</title><desc id="d">Agent event, then minimize and redact, then optional Jev decision provider producing an advisory signal, then policy and human approval, then a Decision Witness record, then a Run Capsule evidence record, which feeds replay, diff and verify. The Jev provider, minimization step, advisory signal and Decision Witness are proposed and not implemented.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b3b4f"/></marker></defs>
<rect x="0.75" y="0.75" width="718.5" height="604.5" rx="14" fill="#fbfbf9" stroke="#d6d6cc" stroke-width="1.5"/>
<text x="26" y="34" font-size="15" fill="#16161c"><tspan font-weight="700">Conceptual architecture</tspan><tspan dx="12" font-size="13" fill="#4b4b5a">Exploratory design. Not a shipped integration.</tspan></text>
<rect x="26" y="62" width="196" height="96" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="124.0" y="96.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Agent event</text>
<text x="124.0" y="115.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">tool request, model call,</text>
<text x="124.0" y="133.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">or delegation</text>
<rect x="262" y="62" width="196" height="96" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="360.0" y="96.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Minimize + redact</text>
<text x="360.0" y="115.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">approved fields only,</text>
<text x="360.0" y="133.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">schema-checked</text>
<rect x="498" y="62" width="196" height="96" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="596.0" y="96.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Jev decision provider</text>
<text x="596.0" y="115.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">optional, external service</text>
<text x="596.0" y="133.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">Choice · Score · Noul</text>
<rect x="498" y="196" width="196" height="96" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="596.0" y="230.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Advisory signal</text>
<text x="596.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">typed answer + probabilities</text>
<text x="596.0" y="267.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">first test: shadow mode</text>
<rect x="262" y="196" width="196" height="96" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="360.0" y="230.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Policy + human approval</text>
<text x="360.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">OPA/Rego, hard constraints,</text>
<text x="360.0" y="267.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">human review (experimental)</text>
<rect x="26" y="196" width="196" height="96" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="124.0" y="230.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Decision Witness</text>
<text x="124.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">model, answer, policy</text>
<text x="124.0" y="267.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">outcome, approval, digests</text>
<path d="M222 110.0 L260 110.0" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M458 110.0 L496 110.0" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M596.0 158 L596.0 194" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M498 244.0 L460 244.0" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M262 244.0 L224 244.0" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<path d="M124.0 292 L124.0 328" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="26" y="330" width="668" height="78" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="360.0" y="355.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Run Capsule / evidence record</text>
<text x="360.0" y="374.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">captured execution evidence · sealing is opt-in</text>
<text x="360.0" y="392.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">a later assessment is linked as its own signed attestation, never a silent edit of a sealed capsule</text>
<rect x="26" y="452" width="204" height="70" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="128.0" y="473.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Replay</text>
<text x="128.0" y="492.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">supported surfaces only;</text>
<text x="128.0" y="510.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">decision playback: proposed</text>
<path d="M128.0 408 L128.0 450" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="258" y="452" width="204" height="70" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="360.0" y="473.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Diff</text>
<text x="360.0" y="492.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">structural comparison</text>
<text x="360.0" y="510.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">across runs</text>
<path d="M360.0 408 L360.0 450" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="490" y="452" width="204" height="70" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="592.0" y="473.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Verify</text>
<text x="592.0" y="492.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">offline integrity check</text>
<text x="592.0" y="510.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">when the capsule is sealed</text>
<path d="M592.0 408 L592.0 450" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<line x1="26" y1="546" x2="694" y2="546" stroke="#d6d6cc"/>
<rect x="26" y="562" width="26" height="14" rx="4" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="60" y="574" font-size="12.5" fill="#4b4b5a">In NovaFabric today (maturity varies)</text>
<rect x="370.0" y="562" width="26" height="14" rx="4" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="404.0" y="574" font-size="12.5" fill="#4b4b5a">Proposed, not implemented</text>
<text x="26" y="598" font-size="12.5" fill="#4b4b5a">A Jev signal is advisory: it cannot grant permission that a hard rule denies.</text>
</svg>
