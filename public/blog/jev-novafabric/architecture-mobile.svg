<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 996" role="img" aria-labelledby="t d" font-family="Inter, 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Conceptual architecture: Jev decision evidence in NovaFabric (proposed, not shipped)</title><desc id="d">Agent event, then minimize and redact, then optional Jev decision provider producing an advisory signal, then policy and human approval, then a Decision Witness record, then a Run Capsule evidence record, which feeds replay, diff and verify. The Jev provider, minimization step, advisory signal and Decision Witness are proposed and not implemented.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b3b4f"/></marker></defs>
<rect x="0.75" y="0.75" width="358.5" height="994.5" rx="14" fill="#fbfbf9" stroke="#d6d6cc" stroke-width="1.5"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#16161c">Conceptual architecture</text>
<text x="24" y="52" font-size="12.5" fill="#4b4b5a">Exploratory design. Not a shipped integration.</text>
<rect x="30" y="72" width="300" height="62" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="180.0" y="98.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Agent event</text>
<text x="180.0" y="117.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">tool request, model call, or delegation</text>
<path d="M180.0 134 L180.0 158" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="160" width="300" height="62" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="180.0" y="186.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Minimize + redact</text>
<text x="180.0" y="205.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">approved fields only, schema-checked</text>
<path d="M180.0 222 L180.0 246" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="248" width="300" height="80" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="180.0" y="274.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Jev decision provider</text>
<text x="180.0" y="293.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">optional, external service</text>
<text x="180.0" y="311.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">Choice · Score · Noul</text>
<path d="M180.0 328 L180.0 352" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="354" width="300" height="80" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="180.0" y="380.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Advisory signal</text>
<text x="180.0" y="399.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">typed answer + probabilities</text>
<text x="180.0" y="417.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">first test: shadow mode</text>
<path d="M180.0 434 L180.0 458" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="460" width="300" height="80" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="180.0" y="486.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Policy + human approval</text>
<text x="180.0" y="505.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">OPA/Rego, hard constraints,</text>
<text x="180.0" y="523.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">human review (experimental)</text>
<path d="M180.0 540 L180.0 564" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="566" width="300" height="80" rx="10" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="180.0" y="592.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Decision Witness</text>
<text x="180.0" y="611.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">model, answer, policy outcome,</text>
<text x="180.0" y="629.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">approval, digests</text>
<path d="M180.0 646 L180.0 670" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="672" width="300" height="98" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="180.0" y="698.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Run Capsule / evidence record</text>
<text x="180.0" y="717.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">captured evidence · sealing is opt-in</text>
<text x="180.0" y="735.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">later assessments get their own</text>
<text x="180.0" y="753.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">signed attestation</text>
<path d="M180.0 770 L180.0 794" stroke="#3b3b4f" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
<rect x="24" y="796" width="94" height="66" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="71.0" y="815.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Replay</text>
<text x="71.0" y="834.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">supported</text>
<text x="71.0" y="852.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">surfaces</text>
<rect x="133" y="796" width="94" height="66" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="180.0" y="815.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Diff</text>
<text x="180.0" y="834.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">structural</text>
<text x="180.0" y="852.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">comparison</text>
<rect x="242" y="796" width="94" height="66" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="289.0" y="815.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16161c">Verify</text>
<text x="289.0" y="834.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">offline,</text>
<text x="289.0" y="852.5" text-anchor="middle" font-size="12.5" fill="#4b4b5a">if sealed</text>
<line x1="24" y1="884" x2="336" y2="884" stroke="#d6d6cc"/>
<rect x="24" y="900" width="24" height="14" rx="4" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.6"/><text x="56" y="912" font-size="12.5" fill="#4b4b5a">In NovaFabric today (maturity varies)</text>
<rect x="24" y="924" width="24" height="14" rx="4" fill="#fff6e6" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/><text x="56" y="936" font-size="12.5" fill="#4b4b5a">Proposed, not implemented</text>
<text x="24" y="962" font-size="12.5" fill="#4b4b5a">A Jev signal is advisory: it cannot grant</text><text x="24" y="979" font-size="12.5" fill="#4b4b5a">permission that a hard rule denies.</text>
</svg>
